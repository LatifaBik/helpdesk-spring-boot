<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ärenden</title>
</head>
<body>
<h1>Ärenden</h1>

<form th:action="@{/tickets}" method="post">
    <input type="hidden" name="userId" th:value="${userId}">

    <div>
        <label for="title">Titel:</label>
        <input type="text" id="title" name="title"
               maxlength="255" required>
    </div>

    <div>
        <label for="description">Beskrivning:</label>
        <textarea id="description" name="description"
                  maxlength="5000" required></textarea>
    </div>

    <button type="submit">Skapa ärende</button>
</form>

<h2>Ärendelista</h2>

<ul>
    <li th:each="ticket : ${tickets}">
        <span th:text="${ticket.title}"></span>
        – <span th:text="${ticket.status}"></span>
    </li>
</ul>
</body>
</html>
