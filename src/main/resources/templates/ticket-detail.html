<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ärendedetaljer</title>
</head>
<body>
<h1 th:text="${ticket.title}">Ärendets titel</h1>
<p th:text="${ticket.description}"></p>
<p>Status: <span th:text="${ticket.status}"></span></p>

<form th:if="${isAgent}"
      th:action="@{/tickets/{id}/status(id=${ticket.id})}"
      method="post">
    <label for="status">Ändra status</label>
    <select id="status" name="status">
        <option th:each="status : ${statuses}"
                th:value="${status.name()}"
                th:text="${status.name()}"
                th:selected="${status == ticket.status}">
        </option>
    </select>
    <button type="submit">Spara status</button>
</form>

<form th:if="${isAgent and ticket.assignedTo == null}"
      th:action="@{/tickets/{id}/assign(id=${ticket.id})}"
      method="post">
    <button type="submit">Tilldela mig</button>
</form>

<h2>Kommentarer</h2>

<ul>
    <li th:each="comment : ${comments}">
        <strong th:text="${comment.author.username}"></strong>
        <p th:text="${comment.content}"></p>
    </li>
</ul>

<form th:action="@{/tickets/{id}/comments(id=${ticket.id})}"
      method="post">

    <label for="content">Skriv en kommentar</label>
    <textarea id="content" name="content"
              maxlength="5000" required></textarea>



    <button type="submit">Skicka kommentar</button>
</form>
</body>
</html>
